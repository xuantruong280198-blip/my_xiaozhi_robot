name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest
    
    steps:
      # 1. Checkout repo riêng chứa mã nguồn tùy biến của bạn
      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Clone repo gốc xiaozhi-esp32 ra thư mục song song bên ngoài (../xiaozhi-esp32)
      - name: Clone official xiaozhi-esp32
        uses: actions/checkout@v4
        with:
          repository: '78/xiaozhi-esp32'
          path: '../xiaozhi-esp32'
          submodules: 'recursive'

      # 3. Kích hoạt môi trường ESP-IDF và tiến hành build
      - name: Build Project
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      # 4. Lưu lại các tệp binary sau khi build thành công
      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
