name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Tải mã nguồn của repository về môi trường chạy Actions
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Cài đặt môi trường ESP-IDF (phiên bản release/v6.1 theo khuyến nghị cho chip esp32s3)
      - name: Set up ESP-IDF
        uses: espressif/action-setup-idf@v1
        with:
          idf_version: 'release/v6.1'
          target: 'esp32s3'

      # 3. Tiến hành biên dịch Firmware
      - name: Build Project
        run: |
          idf.py set-target esp32s3
          idf.py build

      # 4. Lưu lại các file .bin sau khi build xong để tải về (Artifacts)
      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
